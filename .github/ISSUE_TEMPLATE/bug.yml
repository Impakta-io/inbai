name: Bug
description: Report something that does not behave as the docs describe.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Output of running `inbai` and `inbaid`, and the operating system.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
