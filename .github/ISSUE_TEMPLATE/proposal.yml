name: Proposal
description: Propose a design change before writing a large pull request.
title: "Proposal: "
labels: [proposal]
body:
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: The decision you want the project to make.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the current design is not enough
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: true
