name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of the ones ahead of it.
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/inbai ./cmd/inbai
          go build -o bin/inbaid ./cmd/inbaid
      - name: Test
        run: go test ./...
      - name: Check docs
        run: go run ./tools/docscheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  makefile:
    name: makefile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      # go install fetches dozens of modules, and the module proxy and checksum
      # database sometimes drop a stream. Retry before failing the job.
      - name: Install golangci-lint
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 && exit 0
            echo "go install failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Make
        run: make build test lint docs-check

  # Tests in internal/store, internal/service, internal/events and
  # test/integration skip without INBAI_TEST_DATABASE. This job runs them
  # against a throwaway PostgreSQL. They empty the inbAI tables, so packages
  # run one at a time (-p 1).
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: inbai-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INBAI_TEST_DATABASE: postgres://postgres:inbai-ci@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Test against PostgreSQL
        run: go test -race -count=1 -p 1 ./...

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require Signed-off-by
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r commit; do
            body=$(git log -1 --format=%B "$commit")
            if ! printf '%s\n' "$body" | grep -q '^Signed-off-by: '; then
              echo "Missing Signed-off-by: $commit"
              missing=1
            fi
          done < <(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          exit "$missing"
