name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Test and check docs
        run: |
          go test ./...
          go run ./tools/reference -check
          go run ./tools/docscheck

      - name: Build release archives
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/Impakta-io/inbai/internal/version.Version=${VERSION}"

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi
            STAGE="dist/stage_${GOOS}_${GOARCH}"
            mkdir -p "$STAGE"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "${STAGE}/inbai${EXT}" ./cmd/inbai
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "${STAGE}/inbaid${EXT}" ./cmd/inbaid
            cp LICENSE README.md "$STAGE/"
            if [ "$GOOS" = "windows" ]; then
              (cd "$STAGE" && zip -q "../inbai_${VERSION}_${GOOS}_${GOARCH}.zip" "inbai${EXT}" "inbaid${EXT}" LICENSE README.md)
            else
              tar -C "$STAGE" -czf "dist/inbai_${VERSION}_${GOOS}_${GOARCH}.tar.gz" inbai inbaid LICENSE README.md
            fi
            rm -rf "$STAGE"
          done

          (cd dist && sha256sum inbai_* > checksums.txt)
          bash packaging/homebrew/render.sh "$VERSION" dist/checksums.txt > dist/inbai.rb

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          EXTRA=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            "${EXTRA[@]}"

      - name: Update Homebrew tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: Impakta-io/homebrew-tap
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/inbai.rb tap/Formula/inbai.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/inbai.rb
          if git diff --cached --quiet; then
            echo "Formula/inbai.rb is already up to date."
            exit 0
          fi
          git commit -s -m "inbai ${TAG#v}"
          git push origin HEAD
