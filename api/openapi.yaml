openapi: 3.1.0
info:
  title: inbAI API
  version: 0.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    Operator HTTP API served by inbaid. Routes live under /v1.
    Create, send, and reply accept an Idempotency-Key header. A repeat of a completed key with the
    same request returns the first result. A repeat while the first request runs is 409. The same key
    with a different request is 422. Send, reply, and create keep separate keys.
    Errors use RFC 9457 problem details.
    A 502 detail is the mail server's reason when it refused the request.
    Otherwise it names the X-Request-Id to find in the server log, not the error.
    The caller is an operator bearer token or an agent access token.
    An access token is 503 when the server cannot read whether its agent is suspended.
servers:
  - url: http://127.0.0.1:8787
security:
  - operatorBearer: []
paths:
  /oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange a client id and secret for an access token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: bearer
                  expires_in:
                    type: integer
        "401":
          description: Invalid client
        "413":
          description: The form is larger than 4 KiB
  /v1/agents:
    post:
      operationId: createAgent
      summary: Create a client credential. The secret is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created
        "403":
          $ref: "#/components/responses/Problem"
  /v1/grants:
    post:
      operationId: createGrant
      summary: Grant one permission on one inbox to an agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, inbox, permission]
              properties:
                agent:
                  type: string
                inbox:
                  type: string
                permission:
                  type: string
                  enum: [read, send, reply, delete, manage]
      responses:
        "201":
          description: Created
        "403":
          $ref: "#/components/responses/Problem"
  /v1/agents/{name}/suspend:
    post:
      operationId: suspendAgent
      summary: Stop an agent from exchanging a secret or using an access token.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Suspended
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/agents/{name}/resume:
    post:
      operationId: resumeAgent
      summary: Lift a suspension. An agent that is not suspended is still a success.
      description: |
        The agent can exchange its secret again.
        An access token issued before the suspension and not yet expired is accepted again.
        Grants are unchanged. A webhook the suspension disabled stays disabled; the agent deletes it and creates a new one.
        The audit log records agent.resume, also when the agent was not suspended.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Resumed, or was not suspended
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/grants/{agent}/{inbox}/{permission}:
    delete:
      operationId: revokeGrant
      summary: Remove one permission. A grant that is already gone is still a success.
      parameters:
        - name: agent
          in: path
          required: true
          schema:
            type: string
        - name: inbox
          in: path
          required: true
          schema:
            type: string
        - name: permission
          in: path
          required: true
          schema:
            type: string
            enum: [read, send, reply, delete, manage]
      responses:
        "204":
          description: Revoked
        "403":
          $ref: "#/components/responses/Problem"
  /v1/audit:
    get:
      operationId: listAudit
      summary: List operator actions for agents, grants, and inboxes.
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Actions in order
        "403":
          $ref: "#/components/responses/Problem"
  /v1/retention:
    get:
      operationId: getRetention
      summary: Read how many days the server or one inbox keeps mail. Zero keeps mail.
      parameters:
        - name: inbox
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The stored period, or the server default when no row is stored.
        "403":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setRetention
      summary: Set how many days the server or one inbox keeps mail. Zero keeps mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: integer
                  minimum: 0
                inbox:
                  type: string
      responses:
        "200":
          description: Stored
        "403":
          $ref: "#/components/responses/Problem"
  /v1/retention/run:
    post:
      operationId: runRetention
      summary: Delete mail older than the retention period. A message with no received time is kept.
      responses:
        "200":
          description: Count of deleted messages
        "403":
          $ref: "#/components/responses/Problem"
  /v1/inboxes:
    post:
      operationId: createInbox
      summary: Create one inbox in the configured domain.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInbox"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
          description: >-
            Either a request with the same Idempotency-Key is still running, or the address cannot be
            created. An account already has this local part, or the local part is operator or service,
            which inbai init reserves. Nothing is created, and the Idempotency-Key is given back.
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listInboxes
      summary: List inboxes. An operator token is required.
      description: |
        The operator and service accounts inbai init creates are not inboxes and are not listed.
        A page can hold fewer inboxes than its limit and still have a next cursor.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Inboxes
          content:
            application/json:
              schema:
                type: object
                required: [inboxes]
                properties:
                  inboxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Inbox"
                  next:
                    type: string
                    description: Opaque cursor for the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteInbox
      summary: Delete one inbox. An operator token is required.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
          description: The id is the operator or service account inbai init created. It is not an inbox and is not deleted.
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/allowlist:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAllowlist
      summary: Read the sender allowlist for one inbox.
      responses:
        "200":
          description: Allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Allowlist"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setAllowlist
      summary: Replace the sender allowlist for one inbox. An empty list removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Allowlist"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Allowlist"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/quota:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getStorageQuota
      summary: Read the disk storage quota and usage for one inbox.
      responses:
        "200":
          description: Storage quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageQuota"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setStorageQuota
      summary: Set or clear the disk storage quota for one inbox. Limit zero clears the cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limitBytes]
              properties:
                limitBytes:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageQuota"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/generate:
    post:
      operationId: generateInboxes
      summary: Create many inboxes. More than 50 addresses returns a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix, count]
              properties:
                prefix:
                  type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        "201":
          description: Created in this request
          content:
            application/json:
              schema:
                type: object
                required: [inboxes]
                properties:
                  inboxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Inbox"
                  existing:
                    type: array
                    description: Addresses an account already had. They were skipped, not created. Absent when there are none.
                    items:
                      type: string
        "202":
          description: Accepted as a job
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
          description: Every address already had an account. Nothing was created.
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Read a bulk-create job. Only an operator or the agent that started it can read it.
      description: |
        An operator reads any job.
        An agent reads a job it started while it holds inbox:provision on *.
        Any other caller gets 404, the same as for an id that does not exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
          description: The job does not exist, or the caller may not read it.
  /v1/inboxes/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listMessages
      summary: List messages in an inbox. A q query parameter searches text.
      description: Messages are newest first, and so are search results. The cursor continues with older messages.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: sendMessage
      summary: Submit a plain-text message as the inbox.
      description: The caller needs send on the inbox. from is optional. Without it the message is sent as the inbox's own address. Any other from must be an address the mail server lets this inbox send as, compared case-insensitively, or the call answers 403. That rule applies to the operator too. The per-domain daily quota counts the sender's domain.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "202":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: submitted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMessage
      summary: Read one message, including its plain-text body and threading headers.
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMessage
      summary: Delete one message.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}/attachments/{blobId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
      - name: blobId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: downloadAttachment
      summary: Download one attachment. The caller needs a read grant.
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replyMessage
      summary: Reply to one message. The server sets In-Reply-To and References.
      description: The caller needs reply on the inbox. The reply goes to the original message's first Reply-To address, or to its From when it has no Reply-To. to may be omitted or set to that address. A different to also needs send on the inbox, or the call answers 403. A message with neither header answers 400. from follows the same rule as sendMessage.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyMessage"
      responses:
        "202":
          description: Submitted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: health
      summary: Process is running.
      security: []
      responses:
        "200":
          description: OK
  /readyz:
    get:
      operationId: ready
      summary: Dependencies answer. The event database is pinged when INBAI_DATABASE_URL is set.
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready. The detail names the dependency that did not answer, not its error.
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus text for the event feed.
      security: []
      responses:
        "200":
          description: Metrics
  /v1/hooks/ingest:
    post:
      operationId: ingestHint
      summary: Stalwart message-ingest hint. The recipient address selects the inbox. The numeric account id is ignored.
      security: []
      parameters:
        - name: X-Inbai-Ingest
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Inboxes synced
        "401":
          description: Rejected secret
  /v1/events:
    get:
      operationId: listEvents
      summary: Long-poll mail changes after a consumer cursor.
      parameters:
        - name: inbox
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          description: Return events with an id greater than this. The default 0 starts at the oldest event.
          schema:
            type: integer
        - name: latest
          in: query
          description: When true, wait only for events recorded after the request starts. It cannot be combined with after.
          schema:
            type: boolean
        - name: timeout
          in: query
          description: Seconds to wait. The maximum is 25.
          schema:
            type: integer
      responses:
        "200":
          description: Events in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/suppressions:
    get:
      operationId: listSuppressions
      summary: List recipients suppressed after a permanent delivery failure.
      responses:
        "200":
          description: Suppression list
          content:
            application/json:
              schema:
                type: object
                required: [suppressions]
                properties:
                  suppressions:
                    type: array
                    items:
                      type: object
                      required: [address, reason]
                      properties:
                        address:
                          type: string
                        reason:
                          type: string
        "403":
          $ref: "#/components/responses/Problem"
  /v1/webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks on one inbox. The secret is not returned.
      description: An agent sees only the webhooks it created, including disabled ones, and needs no grant to list them. An operator sees every webhook on the inbox.
      parameters:
        - name: inbox
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWebhook
      summary: Register a signed webhook. The secret is shown once.
      description: The caller needs read on the inbox. The url must be https and resolve only to public addresses. A loopback, link-local, private or other internal address answers 400. Redirects are not followed. An operator can allow http and private addresses with INBAI_WEBHOOK_ALLOW_PRIVATE. An agent may hold 10 webhooks on one inbox, disabled ones included; the next answers 429 until one is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inbox, url]
              properties:
                inbox:
                  type: string
                url:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, secret]
                properties:
                  id:
                    type: string
                  secret:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteWebhook
      summary: Delete one webhook. Deliveries still queued for it are not sent.
      description: The agent that created it or an operator may delete it. Any other caller gets 404, as for an id that does not exist.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes a retry safe. A repeat of a completed key returns the first result without creating or
        sending again. On createInbox, sendMessage, and replyMessage the key is held while the request
        runs and bound to its body. There a repeat while the first request runs is 409, the same key with
        a different body is 422, a failed request gives the key back, and a key held by a server that
        stopped is taken over after 10 minutes.
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size. The default is 50 and the maximum is 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as next on the previous page.
      schema:
        type: string
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    CreateInbox:
      type: object
      required: [localPart]
      properties:
        localPart:
          type: string
        quotaBytes:
          type: integer
          minimum: 0
          description: Optional per-inbox disk storage cap in bytes. Defaults to the server default (100 MiB).
    StorageQuota:
      type: object
      required: [limitBytes, usedBytes]
      properties:
        limitBytes:
          type: integer
          minimum: 0
          description: Disk storage cap in bytes. Zero means no storage cap is set.
        usedBytes:
          type: integer
          minimum: 0
          description: Disk storage currently used in bytes.
    Allowlist:
      type: object
      required: [senders]
      properties:
        senders:
          type: array
          description: Addresses or domains. An empty array removes the list.
          items:
            type: string
        set:
          type: boolean
          description: True when the inbox has a list.
    Inbox:
      type: object
      required: [id, address]
      properties:
        id:
          type: string
        address:
          type: string
    SendMessage:
      type: object
      required: [to, subject]
      properties:
        from:
          type: string
          description: Optional. The inbox's own address when omitted. Otherwise an address the mail server lets this inbox send as.
        to:
          type: string
        subject:
          type: string
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    ReplyMessage:
      type: object
      properties:
        from:
          type: string
          description: Optional. The same rule as from on SendMessage.
        to:
          type: string
          description: Optional. The original message's first Reply-To address, or its From, when omitted. Another address needs send on the inbox.
        subject:
          type: string
          description: Optional. The original subject after a Re prefix when omitted.
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    Attachment:
      type: object
      required: [name, type, data]
      properties:
        name:
          type: string
        type:
          type: string
        data:
          type: string
          contentEncoding: base64
    Message:
      type: object
      required: [id, subject, preview]
      properties:
        id:
          type: string
        subject:
          type: string
        preview:
          type: string
        receivedAt:
          type: string
          format: date-time
        text:
          type: string
          description: Plain-text body. At most 1 MiB. A longer body is cut, and textTruncated is true. Stalwart may end a cut body with "...".
        textTruncated:
          type: boolean
          description: Present and true only when text was cut at the 1 MiB limit. The message is longer than text shows. Do not quote, summarize as complete, or reply to it as if the whole body were read.
        messageId:
          type: array
          items:
            type: string
        inReplyTo:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
        from:
          type: string
          description: Sender address when the mail server returned one.
        replyTo:
          type: string
          description: Reply-To address when the mail server returned one. A reply goes to its first address.
        senderAllowed:
          type: boolean
          description: Present only when the inbox has a sender allowlist. True when from matches an address or its domain on that list.
        authentication:
          type: object
          description: SPF, DKIM, and DMARC results from Authentication-Results, and spam when the message is marked junk. An absent field was not on the message.
          properties:
            spf:
              type: string
            dkim:
              type: string
            dmarc:
              type: string
            spam:
              type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/StoredAttachment"
    StoredAttachment:
      type: object
      required: [name, type, size]
      properties:
        name:
          type: string
        type:
          type: string
        size:
          type: integer
        blobId:
          type: string
    Job:
      type: object
      required: [id, status, total, created]
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: integer
        created:
          type: integer
        error:
          type: string
        inboxes:
          type: array
          items:
            $ref: "#/components/schemas/Inbox"
        existing:
          type: array
          description: Addresses an account already had. They were skipped, not created. Absent when there are none.
          items:
            type: string
    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.
    Event:
      type: object
      required: [id, inbox, messageId, kind]
      properties:
        id:
          type: integer
        inbox:
          type: string
        messageId:
          type: string
        kind:
          type: string
    EventList:
      type: object
      required: [events, after]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        after:
          type: integer
          description: The cursor to pass as after on the next call. It is the id of the last event returned, or the cursor the call waited from when none were returned.
    Webhook:
      type: object
      required: [id, inbox, url, agent, active]
      properties:
        id:
          type: string
        inbox:
          type: string
        url:
          type: string
        agent:
          type: string
          description: The agent that created the webhook, or operator.
        active:
          type: boolean
          description: False once a delivery was refused because the creating agent lost read on the inbox or was suspended. A disabled webhook stays disabled after access returns.
        disabledReason:
          type: string
          description: Why the webhook was disabled. Absent while it is active.
