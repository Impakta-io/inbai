openapi: 3.1.0
info:
  title: inbAI API
  version: 0.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    Operator HTTP API served by inbaid. Routes live under /v1.
    Create and send accept an Idempotency-Key header.
    Errors use RFC 9457 problem details.
    The caller is an operator bearer token. Agent OAuth is not implemented.
servers:
  - url: http://127.0.0.1:8787
security:
  - operatorBearer: []
paths:
  /oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange a client id and secret for an access token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: bearer
                  expires_in:
                    type: integer
        "401":
          description: Invalid client
  /v1/agents:
    post:
      operationId: createAgent
      summary: Create a client credential. The secret is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created
        "403":
          $ref: "#/components/responses/Problem"
  /v1/grants:
    post:
      operationId: createGrant
      summary: Grant one permission on one inbox to an agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, inbox, permission]
              properties:
                agent:
                  type: string
                inbox:
                  type: string
                permission:
                  type: string
                  enum: [read, send, reply, delete, manage]
      responses:
        "201":
          description: Created
        "403":
          $ref: "#/components/responses/Problem"
  /v1/inboxes:
    post:
      operationId: createInbox
      summary: Create one inbox in the configured domain.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInbox"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/generate:
    post:
      operationId: generateInboxes
      summary: Create many inboxes. More than 50 addresses returns a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix, count]
              properties:
                prefix:
                  type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        "201":
          description: Created in this request
          content:
            application/json:
              schema:
                type: object
                required: [inboxes]
                properties:
                  inboxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Inbox"
        "202":
          description: Accepted as a job
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Read a bulk-create job.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listMessages
      summary: List messages in an inbox. A q query parameter searches text.
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: sendMessage
      summary: Submit a plain-text message as the inbox.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "202":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: submitted
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMessage
      summary: Read one message, including its plain-text body and threading headers.
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMessage
      summary: Delete one message.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replyMessage
      summary: Reply to one message. The server sets In-Reply-To and References.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "202":
          description: Submitted
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    CreateInbox:
      type: object
      required: [localPart]
      properties:
        localPart:
          type: string
    Inbox:
      type: object
      required: [id, address]
      properties:
        id:
          type: string
        address:
          type: string
    SendMessage:
      type: object
      required: [from, to, subject]
      properties:
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    Attachment:
      type: object
      required: [name, type, data]
      properties:
        name:
          type: string
        type:
          type: string
        data:
          type: string
          contentEncoding: base64
    Message:
      type: object
      required: [id, subject, preview]
      properties:
        id:
          type: string
        subject:
          type: string
        preview:
          type: string
        text:
          type: string
        messageId:
          type: array
          items:
            type: string
        inReplyTo:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/StoredAttachment"
    StoredAttachment:
      type: object
      required: [name, type, size]
      properties:
        name:
          type: string
        type:
          type: string
        size:
          type: integer
    Job:
      type: object
      required: [id, status, total, created]
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: integer
        created:
          type: integer
        error:
          type: string
        inboxes:
          type: array
          items:
            $ref: "#/components/schemas/Inbox"
    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
