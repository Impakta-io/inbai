openapi: 3.1.0
info:
  title: inbAI API
  version: 0.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    Operator HTTP API served by inbaid. Routes live under /v1.
    Create and send accept an Idempotency-Key header.
    Errors use RFC 9457 problem details.
    The caller is an operator bearer token or an agent access token.
servers:
  - url: http://127.0.0.1:8787
security:
  - operatorBearer: []
paths:
  /oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange a client id and secret for an access token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: bearer
                  expires_in:
                    type: integer
        "401":
          description: Invalid client
  /v1/agents:
    post:
      operationId: createAgent
      summary: Create a client credential. The secret is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created
        "403":
          $ref: "#/components/responses/Problem"
  /v1/grants:
    post:
      operationId: createGrant
      summary: Grant one permission on one inbox to an agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, inbox, permission]
              properties:
                agent:
                  type: string
                inbox:
                  type: string
                permission:
                  type: string
                  enum: [read, send, reply, delete, manage]
      responses:
        "201":
          description: Created
        "403":
          $ref: "#/components/responses/Problem"
  /v1/agents/{name}/suspend:
    post:
      operationId: suspendAgent
      summary: Stop an agent from exchanging a secret or using an access token.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Suspended
        "403":
          $ref: "#/components/responses/Problem"
  /v1/grants/{agent}/{inbox}/{permission}:
    delete:
      operationId: revokeGrant
      summary: Remove one permission. A grant that is already gone is still a success.
      parameters:
        - name: agent
          in: path
          required: true
          schema:
            type: string
        - name: inbox
          in: path
          required: true
          schema:
            type: string
        - name: permission
          in: path
          required: true
          schema:
            type: string
            enum: [read, send, reply, delete, manage]
      responses:
        "204":
          description: Revoked
        "403":
          $ref: "#/components/responses/Problem"
  /v1/audit:
    get:
      operationId: listAudit
      summary: List operator actions for agents, grants, and inboxes.
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Actions in order
        "403":
          $ref: "#/components/responses/Problem"
  /v1/retention:
    get:
      operationId: getRetention
      summary: Read how many days the server or one inbox keeps mail. Zero keeps mail.
      parameters:
        - name: inbox
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The stored period, or the server default when no row is stored.
        "403":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setRetention
      summary: Set how many days the server or one inbox keeps mail. Zero keeps mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: integer
                  minimum: 0
                inbox:
                  type: string
      responses:
        "200":
          description: Stored
        "403":
          $ref: "#/components/responses/Problem"
  /v1/retention/run:
    post:
      operationId: runRetention
      summary: Delete mail older than the retention period. A message with no received time is kept.
      responses:
        "200":
          description: Count of deleted messages
        "403":
          $ref: "#/components/responses/Problem"
  /v1/inboxes:
    post:
      operationId: createInbox
      summary: Create one inbox in the configured domain.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInbox"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listInboxes
      summary: List accounts in the mail backend. An operator token is required.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Inboxes
          content:
            application/json:
              schema:
                type: object
                required: [inboxes]
                properties:
                  inboxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Inbox"
                  next:
                    type: string
                    description: Opaque cursor for the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteInbox
      summary: Delete one account. An operator token is required.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/allowlist:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAllowlist
      summary: Read the sender allowlist for one inbox.
      responses:
        "200":
          description: Allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Allowlist"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setAllowlist
      summary: Replace the sender allowlist for one inbox. An empty list removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Allowlist"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Allowlist"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/quota:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getStorageQuota
      summary: Read the disk storage quota and usage for one inbox.
      responses:
        "200":
          description: Storage quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageQuota"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setStorageQuota
      summary: Set or clear the disk storage quota for one inbox. Limit zero clears the cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limitBytes]
              properties:
                limitBytes:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageQuota"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/generate:
    post:
      operationId: generateInboxes
      summary: Create many inboxes. More than 50 addresses returns a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix, count]
              properties:
                prefix:
                  type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        "201":
          description: Created in this request
          content:
            application/json:
              schema:
                type: object
                required: [inboxes]
                properties:
                  inboxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Inbox"
        "202":
          description: Accepted as a job
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Read a bulk-create job.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listMessages
      summary: List messages in an inbox. A q query parameter searches text.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: sendMessage
      summary: Submit a plain-text message as the inbox.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "202":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: submitted
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMessage
      summary: Read one message, including its plain-text body and threading headers.
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMessage
      summary: Delete one message.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}/attachments/{blobId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
      - name: blobId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: downloadAttachment
      summary: Download one attachment. The caller needs a read grant.
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{id}/messages/{messageId}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: replyMessage
      summary: Reply to one message. The server sets In-Reply-To and References.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "202":
          description: Submitted
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: health
      summary: Process is running.
      security: []
      responses:
        "200":
          description: OK
  /readyz:
    get:
      operationId: ready
      summary: Dependencies answer. The event database is pinged when INBAI_DATABASE_URL is set.
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus text for the event feed.
      security: []
      responses:
        "200":
          description: Metrics
  /v1/hooks/ingest:
    post:
      operationId: ingestHint
      summary: Stalwart message-ingest hint. The recipient address selects the inbox. The numeric account id is ignored.
      security: []
      parameters:
        - name: X-Inbai-Ingest
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Inboxes synced
        "401":
          description: Rejected secret
  /v1/events:
    get:
      operationId: listEvents
      summary: Long-poll mail changes after a consumer cursor.
      parameters:
        - name: inbox
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
        - name: timeout
          in: query
          description: Seconds to wait. The maximum is 25.
          schema:
            type: integer
      responses:
        "200":
          description: Events in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/suppressions:
    get:
      operationId: listSuppressions
      summary: List recipients suppressed after a permanent delivery failure.
      responses:
        "200":
          description: Suppression list
          content:
            application/json:
              schema:
                type: object
                required: [suppressions]
                properties:
                  suppressions:
                    type: array
                    items:
                      type: object
                      required: [address, reason]
                      properties:
                        address:
                          type: string
                        reason:
                          type: string
        "403":
          $ref: "#/components/responses/Problem"
  /v1/webhooks:
    post:
      operationId: createWebhook
      summary: Register a signed webhook. The secret is shown once.
      description: The url must be https and resolve only to public addresses. A loopback, link-local, private or other internal address answers 400. Redirects are not followed. An operator can allow http and private addresses with INBAI_WEBHOOK_ALLOW_PRIVATE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inbox, url]
              properties:
                inbox:
                  type: string
                url:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, secret]
                properties:
                  id:
                    type: string
                  secret:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size. The default is 50 and the maximum is 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as next on the previous page.
      schema:
        type: string
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    CreateInbox:
      type: object
      required: [localPart]
      properties:
        localPart:
          type: string
        quotaBytes:
          type: integer
          minimum: 0
          description: Optional per-inbox disk storage cap in bytes. Defaults to the server default (100 MiB).
    StorageQuota:
      type: object
      required: [limitBytes, usedBytes]
      properties:
        limitBytes:
          type: integer
          minimum: 0
          description: Disk storage cap in bytes. Zero means no storage cap is set.
        usedBytes:
          type: integer
          minimum: 0
          description: Disk storage currently used in bytes.
    Allowlist:
      type: object
      required: [senders]
      properties:
        senders:
          type: array
          description: Addresses or domains. An empty array removes the list.
          items:
            type: string
        set:
          type: boolean
          description: True when the inbox has a list.
    Inbox:
      type: object
      required: [id, address]
      properties:
        id:
          type: string
        address:
          type: string
    SendMessage:
      type: object
      required: [from, to, subject]
      properties:
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    Attachment:
      type: object
      required: [name, type, data]
      properties:
        name:
          type: string
        type:
          type: string
        data:
          type: string
          contentEncoding: base64
    Message:
      type: object
      required: [id, subject, preview]
      properties:
        id:
          type: string
        subject:
          type: string
        preview:
          type: string
        receivedAt:
          type: string
          format: date-time
        text:
          type: string
        messageId:
          type: array
          items:
            type: string
        inReplyTo:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
        from:
          type: string
          description: Sender address when the mail server returned one.
        senderAllowed:
          type: boolean
          description: Present only when the inbox has a sender allowlist. True when from matches an address or its domain on that list.
        authentication:
          type: object
          description: SPF, DKIM, and DMARC results from Authentication-Results, and spam when the message is marked junk. An absent field was not on the message.
          properties:
            spf:
              type: string
            dkim:
              type: string
            dmarc:
              type: string
            spam:
              type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/StoredAttachment"
    StoredAttachment:
      type: object
      required: [name, type, size]
      properties:
        name:
          type: string
        type:
          type: string
        size:
          type: integer
        blobId:
          type: string
    Job:
      type: object
      required: [id, status, total, created]
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: integer
        created:
          type: integer
        error:
          type: string
        inboxes:
          type: array
          items:
            $ref: "#/components/schemas/Inbox"
    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.
    Event:
      type: object
      required: [id, inbox, messageId, kind]
      properties:
        id:
          type: integer
        inbox:
          type: string
        messageId:
          type: string
        kind:
          type: string
    EventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
