name: inbai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stalwart
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD to a random database password, for example openssl rand -hex 24}
      POSTGRES_DB: stalwart
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stalwart -d stalwart"]
      interval: 2s
      timeout: 3s
      retries: 30
  stalwart:
    image: stalwartlabs/stalwart:v1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD to a random database password, for example openssl rand -hex 24}
      STALWART_RECOVERY_MODE: ${STALWART_RECOVERY_MODE:-0}
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_RECOVERY_ADMIN_PASSWORD:?set STALWART_RECOVERY_ADMIN_PASSWORD to a random value that differs from PG_PASSWORD}"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "25:25"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - stalwart:/var/lib/stalwart
    # The entrypoint writes /etc/stalwart/config.json on every start. The image
    # declares a volume there, so without this Docker keeps an anonymous volume
    # per container that "down -v" does not remove after a recreate. The image
    # runs as the stalwart user (uid and gid 2000), and a tmpfs is owned by root
    # unless told otherwise, so the mount names that owner.
    tmpfs:
      - /etc/stalwart:uid=2000,gid=2000
  inbaid:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INBAI_OPERATOR_TOKEN: ${INBAI_OPERATOR_TOKEN:-}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD to a random database password, for example openssl rand -hex 24}
      INBAI_STALWART_URL: https://stalwart
      INBAI_TLS_INSECURE: "1"
      INBAI_SIGNING_KEY: ${INBAI_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${INBAI_CONFIG_DIR:?set INBAI_CONFIG_DIR to the directory that contains config.json}:/config:ro

volumes:
  postgres:
  stalwart:
