name: inbai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stalwart
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      POSTGRES_DB: stalwart
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stalwart -d stalwart"]
      interval: 2s
      timeout: 3s
      retries: 30
  stalwart:
    image: stalwartlabs/stalwart:v1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      STALWART_RECOVERY_MODE: ${STALWART_RECOVERY_MODE:-0}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "25:25"
      - "587:587"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - stalwart:/var/lib/stalwart
  inbaid:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INBAI_OPERATOR_TOKEN: ${INBAI_OPERATOR_TOKEN:?set INBAI_OPERATOR_TOKEN}
      INBAI_DATABASE_URL: postgres://stalwart:${PG_PASSWORD}@postgres:5432/inbai?sslmode=disable
      INBAI_STALWART_URL: https://stalwart
      INBAI_TLS_INSECURE: "1"
      INBAI_SIGNING_KEY: ${INBAI_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${INBAI_CONFIG_DIR:?set INBAI_CONFIG_DIR to the directory that contains config.json}:/config:ro

volumes:
  postgres:
  stalwart:
